name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ml-service:
    name: ML service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ml-service/requirements-test.txt
      # No torch / transformers: tests start the API without models and the
      # detector tests use spaCy's small model
      - run: pip install -r requirements-test.txt
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q

  cli-and-extension:
    name: CLI + VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Both have zero npm dependencies
      - name: CLI tests (include real git commits through the hook)
        run: npm test
        working-directory: packages/cli
      - name: Extension unit tests
        run: npm test
        working-directory: apps/vscode-extension
      - name: Package the extension
        run: npm run package
        working-directory: apps/vscode-extension
      - uses: actions/upload-artifact@v4
        with:
          name: promptguard-vsix
          path: apps/vscode-extension/dist/*.vsix
          if-no-files-found: error

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, ml-service, cli-and-extension]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptguard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: promptguard_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ml-service/requirements-test.txt
      - run: npm ci
        working-directory: apps/backend
      - name: Start a CI-sized ML service (spaCy small, heuristic injection check)
        working-directory: apps/ml-service
        env:
          SPACY_MODEL: en_core_web_sm
          NER_MODEL: ''
          ENABLE_INJECTION_MODEL: 'false'
        run: |
          pip install -r requirements-test.txt "uvicorn>=0.30"
          python -m spacy download en_core_web_sm
          nohup uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/ml.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/ml.log"
          exit 1
      - name: Smoke test (schema → backend → benchmark → CLI → hook → self-scan)
        env:
          ML_SERVICE_URL: http://127.0.0.1:8000
        run: scripts/e2e-smoke.sh
