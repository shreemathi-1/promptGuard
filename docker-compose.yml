services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dlp_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume
      - ./apps/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./apps/ml-service
    environment:
      SPACY_MODEL: en_core_web_sm
      NER_MODEL: dslim/bert-base-NER
      ENABLE_INJECTION_MODEL: "true"
      # Optional local LLM (rule generator, "Why?" explanations).
      # Start it with `docker compose --profile llm up`, or point this at Ollama on the host:
      #   OLLAMA_URL=http://host.docker.internal:11434 docker compose up
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
    ports:
      - "8000:8000"
    # Healthcheck is defined in the Dockerfile (models take ~30–60s to load)

  # Only with `--profile llm`. Pull the model once:
  #   docker compose exec ollama ollama pull qwen2.5-coder:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build: ./apps/backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dlp_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ORIGINS: http://localhost:5173
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      # Not service_healthy: the API serves regex-only scans while models load
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
